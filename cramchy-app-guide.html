<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cramchy guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
/* THEME TOKENS: swap values to match the app's real themes */
:root,[data-theme="strawberry-milk"]{--bg:#fff0f5;--card:#fff;--ink:#3d2420;--line:#3d2420;--accent:#f684b0;--accent-strong:#d94b86;--soft:#ffd9e6;--secondary:#b8d4b4;--on-accent:#3d2420}
[data-theme="strawberry-matcha"]{--bg:#f6f4e8;--card:#fffef9;--ink:#33402a;--line:#33402a;--accent:#f08fb0;--accent-strong:#cc4a78;--soft:#dfe9c8;--secondary:#9db97a;--on-accent:#33402a}
[data-theme="matcha-latte"]{--bg:#f4f1e1;--card:#fffef8;--ink:#2f3a24;--line:#2f3a24;--accent:#a5c47e;--accent-strong:#5f8a3a;--soft:#e3ecce;--secondary:#e8dcc0;--on-accent:#2f3a24}
[data-theme="lavender"]{--bg:#f4effb;--card:#fff;--ink:#3b2b52;--line:#3b2b52;--accent:#b9a3e3;--accent-strong:#7a56c2;--soft:#e3d9f7;--secondary:#cfd9f5;--on-accent:#3b2b52}
[data-theme="mocha"]{--bg:#f6ece2;--card:#fffaf5;--ink:#3a2418;--line:#3a2418;--accent:#c9956f;--accent-strong:#8a4b2a;--soft:#ead7c4;--secondary:#d8b89a;--on-accent:#3a2418}
[data-theme="blueberry-milk"]{--bg:#eef3fc;--card:#fff;--ink:#1f2f5c;--line:#1f2f5c;--accent:#7f9de0;--accent-strong:#3f5fc0;--soft:#d6e2f8;--secondary:#c7d6f5;--on-accent:#1f2f5c}
[data-theme="dark-study"]{--bg:#1c1a21;--card:#27232e;--ink:#f2e8ee;--line:#6b6178;--accent:#9fbf9a;--accent-strong:#f2a0bd;--soft:#332f3a;--secondary:#8fa98a;--on-accent:#1c1a21}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:600 1rem/1.6 Nunito,system-ui,sans-serif;display:grid;place-items:center;transition:background .4s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-strong);outline-offset:3px}
[hidden]{display:none!important}
.shell{text-align:center;padding:20px}.shell h1{font:600 2.4rem Fredoka,sans-serif;margin:0 0 12px}
/* dialog */
.dlg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,24,32,.45);backdrop-filter:blur(4px);z-index:20;padding:12px}
.box:focus{outline:none}.box{position:relative;width:min(900px,100%);height:min(620px,calc(100dvh - 24px));display:grid;grid-template-columns:minmax(260px,38%) 1fr;background:var(--card);border:1.5px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:6px 6px 0 var(--accent);animation:in .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
.art{background:var(--soft);border-right:1.5px solid var(--line);display:grid;place-items:center;padding:18px;min-height:0;transition:background .4s}
.art svg{width:100%;height:100%;max-height:300px;overflow:visible}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem;line-height:1;z-index:3;transition:transform .2s,background .2s}.x:hover{transform:rotate(90deg);background:var(--soft)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane{flex:1;overflow:auto;padding:30px 32px 10px}
.pane.sl{animation:sl .45s cubic-bezier(.2,.9,.3,1)}.pane.sr{animation:sr .45s cubic-bezier(.2,.9,.3,1)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
.eb{display:inline-block;background:var(--soft);border-radius:99px;padding:1px 12px;font-size:.85rem;font-weight:800;color:var(--accent-strong);margin:0 0 10px;max-width:calc(100% - 50px)}
h2{font:600 clamp(1.7rem,3.4vw,2.3rem)/1.1 Fredoka,sans-serif;margin:0 0 14px;padding-right:44px}
.pane p{margin:0 0 12px}.pane b{font-weight:800}
.hello{color:var(--accent-strong);font-weight:800}
.sig{font:italic 600 1.3rem 'Playfair Display',Georgia,serif;color:var(--accent-strong);margin:0}.sig small{display:block;font-size:.95rem;opacity:.85}
.c2{border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 12px;background:var(--card)}
.c2 h3{font:600 1.05rem Fredoka,sans-serif;margin:0 0 2px}.c2 p{margin:0;font-size:.95rem}
.lab{font-size:.8rem;font-weight:800;color:var(--accent-strong)}
.note{border-left:4px solid var(--accent);background:var(--soft);border-radius:4px 12px 12px 4px;padding:9px 14px;font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;font-weight:800;font-size:.9rem;transition:background .2s,transform .2s}
.tabs button:hover{transform:translateY(-2px)}.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.nums{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.nums li{display:flex;gap:10px;align-items:center;opacity:0;animation:up .5s both;animation-delay:calc(var(--n)*.2s + .2s)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.nums i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800}
.demo{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.demo .day{font-size:.8rem;font-weight:800;color:var(--accent-strong)}
.demo small{display:block;opacity:.75;font-size:.82rem}
.flow{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 12px;background:var(--soft);border-radius:14px;padding:10px;font-weight:800;font-size:.85rem}
.flow span{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:3px 14px}.flow em{font-style:normal;color:var(--accent-strong)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px;font-weight:800;transition:background .2s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);transform:translateY(-3px)}
.quote{text-align:center;font:italic 600 1.25rem 'Playfair Display',Georgia,serif;color:var(--accent-strong)}.quote small{display:block;font:600 .85rem Nunito,sans-serif;color:var(--ink);opacity:.75}
/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:12px 24px 18px;flex-wrap:wrap}
.hearts{display:flex;gap:3px;flex:1 1 100%;align-items:center}
.hearts button{width:22px;height:22px;border:0;background:none;padding:0;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.hearts button:hover{transform:scale(1.25)}
.hearts svg{width:100%;fill:var(--soft);stroke:var(--line);stroke-width:1.4;transition:fill .3s}.hearts .on svg{fill:var(--accent-strong)}.hearts .cur svg{fill:var(--accent)}
.hearts span{margin-left:auto;font-size:.82rem;font-weight:800;opacity:.8}
.b{border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-weight:800;padding:9px 20px;transition:transform .15s,background .2s}
.b:hover:not(:disabled){transform:translateY(-2px);background:var(--soft)}.b:disabled{opacity:.35;cursor:not-allowed}
.b.round{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.1rem}
.b.next{flex:1;background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--line);padding:11px 20px}
.b.next:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line);background:var(--accent)}.b.next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
/* scene animation */
.st{stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.pop,.flt,.letter,.drop,.ring,.bar,.spin,.dot,.fly,.grow,.seg1{transform-box:fill-box;transform-origin:center}
.pop{animation:popin .6s cubic-bezier(.3,1.8,.5,1) both}@keyframes popin{from{transform:scale(0)}}
.flt{animation:flt 4s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-9px)}}
.letter{animation:lift 1s .3s cubic-bezier(.3,1.4,.5,1) both}@keyframes lift{from{transform:translateY(36px)}}
.drop{animation:drop 1s .3s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{from{transform:translateY(-100px) scale(1.4);opacity:0}}
.ring{animation:ringp 2s 1.2s ease-out infinite;opacity:0}@keyframes ringp{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
.dash{fill:none;stroke:var(--accent-strong);stroke-width:2.5;stroke-dasharray:5 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.bar{transform-origin:left center;animation:gw .9s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--n)*.12s + .3s)}@keyframes gw{from{transform:scaleX(0)}}
.spin{animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.dot{animation:bn 1s ease-in-out infinite;animation-delay:calc(var(--n)*.15s)}@keyframes bn{50%{transform:translateY(-6px)}}
.fly{animation:fly 3s 1s ease-in-out infinite}@keyframes fly{0%,15%{transform:translate(0,0)}60%,100%{transform:translate(100px,46px)}}
.tk{stroke:var(--accent-strong);stroke-width:3;fill:none;stroke-dasharray:20;animation:tk 3s 1s infinite}@keyframes tk{0%,60%{stroke-dashoffset:20}75%,100%{stroke-dashoffset:0}}
.grow{transform-origin:50% 100%;animation:gr 1.6s .2s cubic-bezier(.3,1.4,.5,1) both}@keyframes gr{from{transform:scale(.25)}}
.mid,.fin{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .4s}
.fin{transform:scale(.88);opacity:.55}.art.f .mid{transform:scale(.88);opacity:.55}.art.f .fin{transform:scale(1.1);opacity:1}
.mh{position:fixed;pointer-events:none;z-index:99;line-height:0}.mh svg{display:block;width:100%;fill:currentColor}
/* PREVIEW ONLY: delete .themes and its script when integrating */
.themes{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;z-index:30}
.themes button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);padding:0}
@media(max-width:700px){.box{grid-template-columns:1fr;grid-template-rows:150px 1fr;height:calc(100dvh - 24px);max-height:640px}.art{border-right:0;border-bottom:1.5px solid var(--line);padding:8px}.art svg{max-height:134px}.pane{padding:20px 20px 8px}.foot{padding:10px 16px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.nums li{opacity:1}.ring{opacity:0}}

html[data-embedded="true"] body{display:block;min-height:100vh;background:transparent;transition:none}
html[data-embedded="true"] .shell,html[data-embedded="true"] .themes{display:none!important}
html[data-embedded="true"] .dlg{position:fixed;inset:0;width:100%;height:100%;padding:12px}
html[data-embedded="true"] .box{width:min(900px,100%);height:min(620px,calc(100dvh - 24px))}
@media(max-width:700px){html[data-embedded="true"] .box{height:calc(100dvh - 24px);max-height:640px}}
</style>
</head>

</div>

 var STEPS=[
 {e:'a little note from chachi',t:'i’m so glad you’re here',s:'env',h:'<p class="hello">Hello, my dear user!</p><p>I’m Charlene Mikaela Caco, a Psychology student from NU Clark and the person behind Cramchy.</p><p>I made this little study space to make busy school days feel more manageable. Your plans, progress, and small wins all deserve a place to land.</p><p>Let’s get you settled in. I’ll show you around, one small step at a time.</p><p class="sig"><small>With love,</small>Chachi</p>'},
 {e:'01 · choose how to open it',t:'your study space can go anywhere',s:'phone',h:'<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="0">iPhone or iPad</button><button role="tab" aria-selected="false" data-tab="1">Android</button><button role="tab" aria-selected="false" data-tab="2">web</button></div><div class="c2 tp" data-p="0"><h3>On iPhone or iPad</h3><p>Open Cramchy in your browser. Tap the <b>three dots → Share → View More → Add to Home Screen → Add</b>. Open your new Cramchy icon whenever you want to study.</p></div><div class="c2 tp" data-p="1" hidden><h3>On Android</h3><p>Open Cramchy in Chrome. Tap ⋮, then scroll the menu for <b>Install app</b> or <b>Install and create shortcut</b>. Follow the prompt to install it; if Chrome offers <b>Create shortcut</b>, tap it, then tap <b>Add</b>.</p></div><div class="c2 tp" data-p="2" hidden><h3>On the web</h3><p>Open Cramchy in your browser and keep using it there. You can sign in whenever you’re ready.</p></div><div class="note">Chrome’s menu wording can vary a little by device. If you don’t see the install option right away, scroll the three-dot menu.</div>'},
 {e:'02 · keep your progress',t:'sign in when you want to sync',s:'sync',h:'<p>Tap ☁ <b>sign in</b>, enter your email, then type the 8-digit code sent to your inbox. Your signed-in account can sync your progress across devices.</p><ol class="nums"><li style="--n:0"><i>1</i><span>Enter your email and tap <b>send code</b>.</span></li><li style="--n:1"><i>2</i><span>Check your inbox for the 8-digit code.</span></li><li style="--n:2"><i>3</i><span>Enter the code and tap <b>sign in</b>.</span></li></ol><div class="note">You can also keep using Cramchy as a guest on this device. Guest work stays local until you choose to sign in.</div>'},
 {e:'03 · start with your classes',t:'add courses once, use them everywhere',s:'course',h:'<p>In <b>Courses</b>, add each subject with its professor, class days and times, room, and grading weights. Your repeating weekly schedule becomes easy to scan in the schedule viewer.</p><div class="demo"><span class="day">MON</span><div><b>your class</b><small>time · room · course color</small></div></div><p>Those courses are also ready to choose in your gradebook and exam season.</p>'},
 {e:'04 · plan the week',t:'planner events show up in tasks',s:'plan',h:'<p>Add a quiz, study block, assignment, or reminder in the <b>Planner</b>. Choose its date and type so it’s easy to spot on your calendar.</p><div class="flow"><span>quiz</span><em>→</em><span>to do in Tasks</span></div><p>Planner items automatically appear in <b>Tasks</b>. Check them off in Tasks when they’re done; the Planner stays a calendar view of what’s happening.</p>'},
 {e:'05 · see how you’re doing',t:'your grades, with the context',s:'grade',h:'<p>Open <b>Grades → Course Gradebook</b> and choose a course. It’s built with National University (NU) students in mind: add scores in the categories your class uses and set weights to match your syllabus. The weights are flexible for other schools, too.</p><div class="c2"><span class="lab">current standing</span><h3>weighted by your course setup</h3><p>scores · category weights · equivalent grade</p></div><p>The dashboard brings your scores, category percentages, and equivalent grade together. <b>Term GWA</b> gives you a separate term-wide view.</p>'},
 {e:'06 · midterms & finals',t:'two exam seasons, kept separate',s:'exam',h:'<p>Choose <b>Midterms</b> or <b>Finals</b> in Exam Mode. Cramchy keeps NU’s two exam seasons separate, each with its own schedule, subjects, topics, notes, and study progress for the selected term.</p><div class="seg"><button data-season="m" aria-pressed="true">midterms</button><button data-season="f" aria-pressed="false">finals</button></div><p>Use the exam workspace to keep the details for that season together while your course list stays in Courses.</p>'},
 {e:'07 · ask for help',t:'meet ask cramchy',s:'chat',h:'<p>Open <b>Ask Cramchy</b> from its chat button to ask how to use the app or ask about your saved courses, tasks, Planner, and grades. Suggested prompts can help you get started.</p><div class="c2"><h3>Need open-ended study help?</h3><p>Enable AI inside the chat for explanations, practice questions, or help planning a study session. It’s optional, and you can switch it off anytime.</p></div><div class="note">For questions about saved school data, ask about one course or term at a time for clearer answers.</div>'},
 {e:'08 · make it yours',t:'find a rhythm that feels good',s:'rhythm',h:'<p>Open the <b>Study</b> tab for a focused timer session. Choose a study space theme in <b>More → Appearance</b> whenever you want a change of scenery.</p><div class="c2"><h3>Choose a study sound</h3><p>On the Study timer, pick Gamma waves, White noise, café ambience, rain, or lo-fi study beats. Tap play or pause and adjust the volume.</p></div><div class="c2 quote">small steps count, too.<small>you can change your plans as you go.</small></div><p>You’re all set. Start wherever you are; Cramchy can grow with your routine.</p>'}];
