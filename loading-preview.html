<style>
:root{--ink:#754652;--rose:#d86f8d;--pink:#f3a7ba;--cream:#fffaf6;--line:#f3ced8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;overflow:hidden;display:grid;place-items:center;background:
radial-gradient(circle at 18% 14%,rgba(255,255,255,.95) 0 9%,transparent 31%),
radial-gradient(circle at 82% 18%,rgba(255,211,223,.88),transparent 34%),
radial-gradient(circle at 45% 94%,rgba(255,228,211,.82),transparent 39%),
linear-gradient(135deg,#f8d6df 0%,#fff7f1 46%,#f4ced9 100%)}
body:before,body:after{content:"";position:fixed;pointer-events:none;filter:blur(34px);opacity:.72}
body:before{width:280px;height:280px;left:-55px;bottom:6%;background:#f2b9c8;border-radius:44% 56% 63% 37%/52% 40% 60% 48%}
body:after{width:240px;height:240px;right:-35px;top:12%;background:#f7dfcc;border-radius:60% 40% 36% 64%/45% 58% 42% 55%}
.shell{position:relative;z-index:2;width:min(680px,calc(100vw - 28px));padding:16px}
.card{position:relative;overflow:hidden;border-radius:40px;padding:34px 34px 30px;background:linear-gradient(180deg,rgba(255,252,248,.96),rgba(255,246,248,.95));border:1px solid rgba(255,255,255,.94);box-shadow:0 32px 82px rgba(118,68,82,.20),0 8px 26px rgba(118,68,82,.08);backdrop-filter:blur(14px)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,rgba(244,163,184,.14),transparent 26%),radial-gradient(circle at 84% 22%,rgba(244,193,153,.13),transparent 24%);pointer-events:none}
.brand{position:relative;display:block;width:min(340px,78%);margin:0 auto 5px;filter:drop-shadow(0 10px 16px rgba(152,74,96,.12))}
.sub{position:relative;text-align:center;font-family:'DM Serif Display',serif;font-style:italic;letter-spacing:.15em;color:#a87b84;font-size:15px;margin-bottom:8px}
.art-wrap{position:relative;display:grid;place-items:center;min-height:350px;margin:0 auto 8px}
.art-wrap:before{content:"";position:absolute;width:min(520px,94%);height:72%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,220,229,.68),rgba(255,245,239,.28) 58%,transparent 76%);filter:blur(4px)}
.sparkle{position:absolute;color:#dd8199;font-size:22px;opacity:.78}.s1{left:10%;top:22%}.s2{right:12%;top:20%}.s3{right:16%;bottom:20%;font-size:16px}.s4{left:15%;bottom:22%;font-size:17px}
.hero-art{position:relative;width:min(520px,92%);height:auto;filter:drop-shadow(0 18px 22px rgba(110,66,77,.15));animation:float 2.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.progress{position:relative;width:min(430px,86%);height:10px;margin:6px auto 0;border-radius:999px;background:#f8e3e8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(135,75,92,.08)}
.progress span{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#e886a1,#f5b2c2,#e886a1);background-size:200% 100%;animation:load 1.45s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-115%);background-position:0 0}65%,100%{transform:translateX(245%);background-position:100% 0}}
.copy{position:relative;text-align:center;margin-top:18px}.copy h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(27px,4.2vw,38px);letter-spacing:-.015em;margin:0;color:#754652}.copy p{margin:10px 0 0;font-size:11px;letter-spacing:.25em;text-transform:uppercase;font-weight:800;color:#b68591}
.dots{display:inline-flex;gap:5px;margin-left:4px;vertical-align:middle}.dots i{width:4px;height:4px;border-radius:50%;background:#d97892;animation:dot 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.tag{text-align:center;margin-top:13px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9a707a;font-weight:800}
@media(max-width:600px){body{overflow:auto;padding:10px}.shell{padding:4px}.card{padding:26px 18px 24px;border-radius:30px}.brand{width:76%}.sub{font-size:13px}.art-wrap{min-height:270px}.hero-art{width:96%}.progress{width:88%}.copy h1{font-size:30px}}
</style>
