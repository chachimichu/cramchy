<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cramchy loading preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --berry:#c64f73;
  --berry-deep:#a94462;
  --muted:#a87783;
  --cream:#fffaf6;
  --pink:#f8d9e2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:var(--berry-deep);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:
    radial-gradient(circle at 18% 16%,rgba(255,255,255,.96) 0 8%,transparent 34%),
    radial-gradient(circle at 82% 20%,rgba(251,218,228,.72),transparent 34%),
    radial-gradient(circle at 50% 95%,rgba(255,231,216,.65),transparent 39%),
    linear-gradient(135deg,#fff8f6 0%,#fffdf9 46%,#fbe8ed 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.42;
  background-image:radial-gradient(rgba(198,79,115,.13) .7px,transparent .7px);
  background-size:22px 22px;
  mask-image:linear-gradient(to bottom,transparent 0%,black 24%,black 76%,transparent 100%);
}
.splash{
  position:relative;
  z-index:1;
  text-align:center;
  padding:36px 24px;
  animation:arrive .45s ease-out both;
}
.brand{
  margin:0;
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;
  font-size:clamp(62px,9vw,112px);
  line-height:.92;
  letter-spacing:-.055em;
  color:var(--berry);
  text-shadow:0 12px 30px rgba(165,67,95,.09);
}
.sub{
  margin-top:18px;
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(15px,2vw,20px);
  letter-spacing:.18em;
  color:#9f727d;
}
.loader{
  width:72px;
  height:8px;
  margin:34px auto 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.loader span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#df7f9a;
  box-shadow:0 4px 10px rgba(198,79,115,.15);
  animation:pulse 1.15s ease-in-out infinite;
}
.loader span:nth-child(2){animation-delay:.16s}
.loader span:nth-child(3){animation-delay:.32s}
.loading-copy{
  margin:15px 0 0;
  font-size:11px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:lowercase;
  color:#b48791;
}
.preview-note{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  font-size:9px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#c29aa4;
  white-space:nowrap;
}
@keyframes pulse{
  0%,100%{opacity:.26;transform:translateY(0) scale(.86)}
  50%{opacity:1;transform:translateY(-4px) scale(1)}
}
@keyframes arrive{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){.splash,.loader span{animation:none}.loader span{opacity:.65}}
</style>
</head>
<body>
<main class="splash" aria-label="Cramchy loading splash preview">
  <h1 class="brand">cramchy.</h1>
  <div class="sub">study companion</div>
  <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="loading-copy">opening your study space...</p>
</main>
<div class="preview-note">loading screen preview · main untouched</div>
</body>
</html>
