name: Cramchy CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate vercel.json
        run: python -m json.tool vercel.json > /dev/null

      - name: Check required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f vercel.json
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '<html' index.html

      - name: Reject unresolved merge conflicts
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html styles.css app.js vercel.json; then
            echo 'Unresolved merge-conflict markers found.'
            exit 1
          fi

      - name: Syntax-check JavaScript
        run: |
          for file in *.js js/*.js; do node --check "$file"; done

      - name: Test Quick GWA rules
        run: node testing/quick-gwa-rules.test.cjs

      - name: Test backups and course identity protection
        run: node testing/backup-data.test.cjs

      - name: Test Planner cloud sign-in
        run: node testing/planner-cloud-sync.test.cjs

      - name: Test Exam Subjects and real app backups
        run: node testing/exam-subjects.test.cjs
