name: Cramchy CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate vercel.json
        run: python -m json.tool vercel.json > /dev/null

      - name: Check required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f vercel.json
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '<html' index.html

      - name: Reject unresolved merge conflicts
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html styles.css app.js vercel.json; then
            echo 'Unresolved merge-conflict markers found.'
            exit 1
          fi

      - name: Syntax-check JavaScript
        run: |
          for file in *.js js/*.js; do node --check "$file"; done

      - name: Test Quick GWA rules
        run: node testing/quick-gwa-rules.test.cjs

      - name: Test backups and course identity protection
        run: node testing/backup-data.test.cjs

      - name: Test Planner cloud sign-in
        run: node testing/planner-cloud-sync.test.cjs

      - name: Test Exam Subjects and real app backups
        run: node testing/exam-subjects.test.cjs

      - name: Test Term GWA honors eligibility
        run: node testing/term-gwa-honors.test.cjs

      - name: Test immediate Home task updates
        run: node testing/home-tasks.test.cjs

      - name: Test study timer persistence
        run: node testing/study-timer.test.cjs

      - name: Test account storage isolation
        run: node testing/account-storage.test.cjs

      - name: Test cloud conflicts and version guards
        run: node testing/cloud-sync.test.cjs

      - name: Test tracker cloud controls and recovery
        run: node testing/tracker-cloud-sync.test.cjs

      - name: Test Planner time validation and week layout
        run: node testing/planner-time.test.cjs

      - name: Test shared course exam schedules
        run: node testing/academic-schedule.test.cjs

      - name: Test More term status refresh
        run: node testing/term-status.test.cjs

      - name: Test dialog keyboard accessibility
        run: node testing/dialog-accessibility.test.cjs

      - name: Test grade insights and workspace navigation
        run: |
          node testing/grade-insights.test.cjs
          node testing/course-timetable.test.cjs
          node testing/grades-workspace.test.cjs
