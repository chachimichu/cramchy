name: Cramchy CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate vercel.json
        run: python -m json.tool vercel.json > /dev/null

      - name: Check required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f vercel.json
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '<html' index.html

      - name: Reject unresolved merge conflicts
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!archive/**'; then
            echo 'Unresolved merge-conflict markers found.'
            exit 1
          fi

      - name: Syntax-check JavaScript
        run: find . -type f -name '*.js' -not -path './.git/*' -not -path './archive/*' -print0 | xargs -0 -n1 node --check

      - name: Validate declared runtime assets
        run: node testing/validate-static.cjs

      - name: Test synthetic data paths
        run: node testing/path-check.cjs

      - name: Test synthetic app readiness gate
        run: node testing/runner-readiness.test.cjs

      - name: Test custom countdown module
        run: node testing/countdown.test.cjs

      - name: Test motivation module
        run: node testing/motivation.test.cjs

      - name: Test streak module
        run: node testing/streak.test.cjs

      - name: Test collectibles module
        run: node testing/collectibles.test.cjs

      - name: Test brain-break module
        run: node testing/brain-break.test.cjs

      - name: Test study timer module
        run: node testing/study-timer.test.cjs

      - name: Test pet duo module
        run: node testing/pet-duo.test.cjs

      - name: Test Chaowi module
        run: node testing/chaowi.test.cjs
