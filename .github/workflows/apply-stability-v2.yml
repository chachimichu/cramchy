name: Apply Cramchy stability patch v2

on:
  push:
    branches:
      - fix/update-stability-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/update-stability-v2

      - name: Apply patch
        run: |
          set -euo pipefail
          if grep -q "2026.09.08-stability.1" app.js; then
            echo "Stability patch already applied."
          else
            base64 -d stability.patch.gz.b64 > /tmp/stability.patch.gz
            gzip -d /tmp/stability.patch.gz
            patch -p1 < /tmp/stability.patch
          fi
          node --check app.js
          python -m json.tool vercel.json > /dev/null

      - name: Commit patched app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f stability.patch.gz.b64 .github/workflows/apply-stability-v2.yml 2>/dev/null || true
          git add app.js index.html vercel.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add update stability and data repair safeguards"
            git push origin fix/update-stability-v2
          fi
