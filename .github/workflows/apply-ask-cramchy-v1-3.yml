name: Apply Ask Cramchy v1.3

on:
  push:
    branches:
      - feature/ask-cramchy-v1-3
    paths:
      - ".github/workflows/apply-ask-cramchy-v1-3.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ask-cramchy-v1-3
          fetch-depth: 0

      - name: Rebuild Ask Cramchy changes
        run: |
          cat .github/ask-cramchy-patch/app.* | base64 -d | gzip -d > /tmp/app.patch
          cat .github/ask-cramchy-patch/styles.* | base64 -d | gzip -d > /tmp/styles.patch
          cat .github/ask-cramchy-patch/icon.* | base64 -d > assets/ask-cramchy.png
          patch -p0 app.js < /tmp/app.patch
          patch -p0 styles.css < /tmp/styles.patch

      - name: Validate integrated app
        run: |
          node --check app.js
          python -m json.tool vercel.json > /dev/null
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f assets/ask-cramchy.png
          grep -q "initAskCramchy" app.js
          grep -q "assets/ask-cramchy.png" app.js
          grep -q "ask-cramchy-launcher" styles.css

      - name: Commit Ask Cramchy v1.3
        run: |
          rm -rf .github/ask-cramchy-patch
          rm -f .github/workflows/apply-ask-cramchy-v1-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css assets/ask-cramchy.png .github
          git commit -m "Add Ask Cramchy v1.3 conversation-aware chatbot"
          git push origin HEAD:feature/ask-cramchy-v1-3
