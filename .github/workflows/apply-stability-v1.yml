name: Apply Cramchy stability patch

on:
  push:
    branches:
      - fix/update-stability-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/update-stability-v1

      - name: Apply stability patch
        run: |
          set -euo pipefail
          if grep -q "2026.09.08-stability.1" app.js; then
            echo "Stability patch already applied."
            exit 0
          fi
          cat > /tmp/stability.patch.gz.b64 <<'PATCHB64'
